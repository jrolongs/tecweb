<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Iniciar Sesión</h1>

        <div class="card">
            <h2 id="login-title">Ingresa tu correo</h2>

            <form id="email-form">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="email-btn">Enviar código</button>
                </div>
            </form>

            <form id="otp-form" style="display: none;">
                <div class="form-group">
                    <label for="code">Código de verificación:</label>
                    <input type="text" id="code" name="code" required inputmode="numeric" autocomplete="one-time-code">
                </div>
                <div class="form-actions">
                    <button type="submit" id="otp-btn">Verificar</button>
                    <button type="button" id="back-btn" class="btn-cancel">Cambiar correo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/login.js"></script>
</body>
</html>
